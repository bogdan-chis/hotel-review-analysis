services:

  # ── Ollama ────────────────────────────────────────────────────────────────
  # Runs the local LLM server. The entrypoint script pulls the model before
  # the server starts, so the backend never hits a "model not found" error.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"           # expose so you can also call Ollama directly from your host
    volumes:
      - ollama_data:/root/.ollama   # persist downloaded models between restarts
      - ./ollama-entrypoint.sh:/entrypoint.sh
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ── Backend ───────────────────────────────────────────────────────────────
  # FastAPI app. Waits for Ollama to be healthy before starting.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  ollama_data:    # named volume so the pulled model survives container restarts